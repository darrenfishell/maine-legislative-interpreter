version: 2

sources:
  - name: raw
    schema: raw
    description: Raw data ingested by dlt from the Maine Legislature API and PDF extraction.
    tables:
      - name: bill_text
        description: Raw bill metadata from the Maine Legislature search API.
        columns:
          - name: ldNumber
            description: LD (Legislative Document) number.
          - name: legislature
            description: Legislature session number.
          - name: paperNumber
            description: Paper number identifier.
          - name: title
            description: Bill title.
          - name: summary
            description: Bill summary text.
          - name: broadSubject
            description: Broad subject classification.
          - name: majorSubject
            description: Major subject classification.
          - name: minorSubject
            description: Minor subject classification.
          - name: detailSubject
            description: Detail subject classification.
          - name: url
            description: URL to the bill text.
          - name: requestId
            description: Request ID from the API.
          - name: documentId
            description: Document ID from the API.
          - name: itemNumber
            description: Item number within the request.
          - name: requestItemType
            description: Type of request item.
          - name: location
            description: Current location/status of the bill.
          - name: ordering
            description: Sort order from the API.

      - name: testimony_attributes
        description: Raw testimony metadata from the Maine Legislature API.
        columns:
          - name: Id
            description: Unique testimony document ID.
          - name: RequestId
            description: Associated bill request ID.
          - name: FirstName
            description: Testifier first name.
          - name: LastName
            description: Testifier last name.
          - name: Organization
            description: Testifier organization (raw, unclustered).
          - name: HearingDate
            description: Date of the committee hearing.
          - name: PresentedDate
            description: Date testimony was presented.
          - name: LDNumber
            description: Associated LD number.
          - name: legislature
            description: Legislature session number.
          - name: FileType
            description: File type of the testimony document.
          - name: FileSize
            description: File size in bytes.
          - name: PolicyArea
            description: Policy area classification.
          - name: Topic
            description: Topic classification.

      - name: testimony_full_text
        description: Raw PDF-extracted testimony text (JSON-encoded, uncleaned).
        columns:
          - name: doc_id
            description: Testimony document ID.
          - name: session
            description: Legislature session number.
          - name: doc_text
            description: Raw extracted text (JSON-encoded string).

  - name: staging_dlt
    schema: staging
    description: Cleaned text produced by the dlt staging pipeline.
    tables:
      - name: stg_testimony_cleaned_text
        description: Testimony text after encoding repair, artifact removal, and normalization.
        columns:
          - name: doc_id
            description: Testimony document ID.
          - name: session
            description: Legislature session number.
          - name: cleaned_text
            description: Cleaned testimony text ready for downstream processing.

  - name: intermediate_dlt
    schema: intermediate
    description: Sentence embeddings produced by the dlt vectorization pipeline.
    tables:
      - name: int_sentence_embeddings
        description: Sentence-level embeddings generated by sentence-transformers.
        columns:
          - name: doc_id
            description: Source testimony document ID.
          - name: sentence
            description: Extracted sentence text.
          - name: sentence_index
            description: Position of the sentence within the document.
          - name: embedding
            description: Vector embedding as JSON array.
          - name: model_name
            description: Name of the embedding model used.
          - name: embedding_dimension
            description: Dimensionality of the embedding vector.
